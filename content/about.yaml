body:
  en: |
    ## Our mission

    To spread a culture of democracy and humanity among families and throughout society.

    ## Our vision

    A democratic, civil community built on coexistence, mutual respect, and acceptance of one another.

    ## Our goals

    Nujeen's work is guided by a set of long-standing commitments:

    - To build family and social relationships on the foundations of democracy, participation, pluralism, and the peaceful resolution of disputes.
    - To strengthen the role of individuals within the family and society, protecting their freedoms and building their capacities.
    - To raise awareness among family members and nurture a spirit of understanding, dialogue, and mutual respect.
    - To reduce the harm of gender discrimination and the negative social attitudes that weigh most heavily on women.
    - To support family economic wellbeing by engaging with public and private policies that affect household income.
    - To respond to the needs of marginalized people — children, people with disabilities, orphans, displaced persons, and refugees.
    - To advance the democratization of educational curricula in partnership with the relevant authorities.
    - To improve health at the individual and community levels, promoting wellbeing and equal access to health services for all.

    ## How we work

    Nujeen pursues these goals through awareness-raising, capacity building, advocacy, accountability and transparency work, conflict resolution, and by building and joining coalitions with partners who share its values.

    ## Our structure

    Nujeen's work is organized across three areas — peace-building and conflict resolution, development, and human rights — spanning child protection, women's empowerment, minority rights, support for people with special needs, social integration and livelihoods, and youth participation and leadership.

    ## Our partners

    Over the years, Nujeen has worked with a wide range of national and international partners, including SAAF, IPPF, Médecins Sans Frontières (MSF), Handicap International, the European Union, Concern Worldwide, GIZ, and UN agencies including UNICEF, UN Women, UNDP, UNFPA, and IOM, alongside ministries and agencies of the Kurdistan Regional Government.
