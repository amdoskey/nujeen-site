intro:
  en: Nujeen for Family Democratizing Organization is an independent, non-governmental, non-profit, and humanitarian organization. Founded in September 2003, it is officially registered with both the Kurdistan Regional Government and the Federal Government in Baghdad.
  ar: منظمة نووژين لدمقرطة العائلة هي منظمة غير حكومية، مستقلة، غير ربحية، وإنسانية، تأسست في أيلول (سبتمبر) 2003، ومجازة رسمياً من قبل حكومة إقليم كوردستان والحكومة الاتحادية في بغداد.
  ku: "پێناسەیا رێکخراوێ: رێکخراوا نوژین ژبو دیموکراسیکرنا خێزانێ، رێکخراوەکا ناحکومی، سەربەخۆ، مروڤاتی و نە قازانجویستە، کار ژبو مەدەنیکرن و دیموکراسیکرنا جڤاکی ب رێیا دیموکراسیکرنا مالباتێ دکە، ل ئیلونا سالا 2003 هاتیە دامەزراندن و ژپال هەردوو حکومەتێن هەرێما کوردستانێ و حکومەتا فەدرالا بەغدا ب ئاوایەکێ فەرمی هاتیە ناساندن."
