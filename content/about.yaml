intro:
  en: Nujeen for Family Democratizing Organization (NFDO) is a non-governmental, non-profit, independent humanitarian organization based in Duhok, in the Kurdistan Region of Iraq. Founded in September 2003 and registered with both the Kurdistan Regional Government and the Federal Government of Iraq, Nujeen has spent more than two decades working alongside families and communities across the region.
