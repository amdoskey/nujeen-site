title: Family Planning Training for Health Care Providers
titleAr: تدريب مقدمي الرعاية الصحية على تنظيم الأسرة
titleKu: راهێنانا پێشکێشکەرێن خزمەتێن ساخلەمیێ ل سەر رێکخستنا خێزانێ
summary:
  en: Nujeen held two family planning trainings for 36 health care providers, with the Directorate of Preventive Health Affairs.
  ar: عقدت نوجين تدريبين حول تنظيم الأسرة لـ36 من مقدمي الرعاية الصحية، بالتعاون مع مديرية الصحة الوقائية.
  ku: رێکخراوا نوژین دوو خولێن راهێنانێ ل سەر رێکخستنا خێزانێ بۆ 36 پێشکێشکەرێن خزمەتێن ساخلەمیێ ئەنجامدان، ب هەڤکاری دگەل رێڤەبەریا کاروبارێن ساخلەمیا پاراستنێ.
body:
  en: |
    Nujeen for Family Democratizing Organization, in collaboration with the Directorate of Preventive Health Affairs, held two trainings for 36 health care providers on Family Planning, under the title "Together for Better Understanding of our Sexual and Reproductive Health and Rights."
  ar: |
    نظّمت منظمة نوجين لدمقرطة الأسرة، بالتعاون مع مديرية الصحة الوقائية، تدريبين لـ36 من مقدمي الرعاية الصحية حول تنظيم الأسرة، تحت عنوان "معًا من أجل فهم أفضل لصحتنا وحقوقنا الجنسية والإنجابية".
  ku: |
    رێکخراوا نوژین ژبو دیموکراسیکرنا خێزانێ، ب هەڤکاری دگەل رێڤەبەریا کاروبارێن ساخلەمیا پاراستنێ، دوو خولێن راهێنانێ بۆ 36 پێشکێشکەرێن خزمەتێن ساخلەمیێ ل سەر رێکخستنا خێزانێ ئەنجامدان، ل ژێر ناڤونیشانێ "پێکڤە ژبو تێگەهشتنەکا باشتر ژ ساخلەمی و مافێن مە یێن سێکسی و زاوزێ".
