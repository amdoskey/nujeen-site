title: Investing in the Next Generation of Healthcare Leaders
titleAr: الاستثمار في الجيل القادم من قادة الرعاية الصحية
titleKu: وەبەرهێنان لە نەوەی داهاتووی سەرکردەکانی تەندروستی
summary:
  en: Nujeen Organization is proud to announce our Golden Sponsorship of the 16th National Assembly of IFMSA Kurdistan.
  ar: تفخر نوجين برعايتها الذهبية للجمعية الوطنية السادسة عشرة لـ IFMSA كردستان، دعمًا لطلاب الطب والأطباء الشباب في جميع أنحاء الإقليم.
