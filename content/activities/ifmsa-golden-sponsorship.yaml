title: Investing in the Next Generation of Healthcare Leaders
titleAr: الاستثمار في الجيل القادم من قادة الرعاية الصحية
titleKu: وەبەرهێنان لە نەوەی داهاتووی سەرکردەکانی تەندروستی
summary:
  en: Nujeen was a Golden Sponsor of the IFMSA Kurdistan 16th Assembly, supporting medical students and young healthcare leaders across sessions on SRHR, GBV, and gender equality.
  ar: كانت نوجين راعيًا ذهبيًا للجمعية السادسة عشرة لـ IFMSA كردستان، دعمًا لطلاب الطب وقادة الرعاية الصحية الشباب عبر جلسات حول الصحة والحقوق الجنسية والإنجابية (SRHR)، والعنف القائم على النوع الاجتماعي (GBV)، والمساواة بين الجنسين.
  ku: نوجین سپۆنسەری زێڕینی کۆنگرەی شازدەیەمی IFMSA کوردستان بوو، و پشتگیری خوێندکارانی پزیشکی و سەرکردە گەنجەکانی بواری تەندروستی کرد لە ڕێگەی دانیشتنەکان دەربارەی SRHR، توندوتیژی لەسەر بنەمای ڕەگەز (GBV)، و یەکسانی ڕەگەزی.
body:
  en: |
    We were honored to be a Golden Sponsor of the IFMSA Kurdistan 16th Assembly, bringing together passionate medical students and young healthcare leaders for meaningful learning, dialogue, and connection.

    Throughout the Assembly, participants engaged in sessions covering a wide range of health and social justice topics, including Sexual and Reproductive Health and Rights (SRHR), Gender-Based Violence (GBV), gender equality, and other critical issues affecting the health and well-being of communities.

    At Nujeen, we believe that empowering young people — especially future healthcare professionals — is essential to building a more informed, inclusive, and equitable healthcare system. We are proud to stand alongside young medical students and support spaces where they can learn, question, advocate, and lead.
  ar: |
    تشرّفنا بأن نكون الراعي الذهبي للجمعية السادسة عشرة لـ IFMSA كردستان، التي جمعت طلاب طب شغوفين وقادة شبابًا في مجال الرعاية الصحية من أجل تعلّم هادف وحوار وتواصل.

    على مدار الجمعية، شارك الحاضرون في جلسات تناولت طيفًا واسعًا من مواضيع الصحة والعدالة الاجتماعية، بما في ذلك الصحة والحقوق الجنسية والإنجابية (SRHR)، والعنف القائم على النوع الاجتماعي (GBV)، والمساواة بين الجنسين، وغيرها من القضايا الحيوية التي تؤثر على صحة المجتمعات ورفاهها.

    في نوجين، نؤمن بأن تمكين الشباب — ولا سيما المتخصصين الصحيين في المستقبل — أمر أساسي لبناء نظام رعاية صحية أكثر وعيًا وشمولًا وإنصافًا. ونفخر بالوقوف إلى جانب طلاب الطب الشباب ودعم المساحات التي يستطيعون فيها أن يتعلّموا ويتساءلوا ويدافعوا ويقودوا.
  ku: |
    شانازیمان پێوە کرد کە سپۆنسەری زێڕینی کۆنگرەی شازدەیەمی IFMSA کوردستان بووین، کە خوێندکارانی پزیشکیی بەتامەزرۆ و سەرکردە گەنجەکانی بواری تەندروستی کۆکردەوە بۆ فێربوون، گفتوگۆ، و پەیوەندییەکی بەسوود.

    لە ماوەی کۆنگرەکەدا، بەشداربووان ئامادەی ئەو دانیشتنانە بوون کە کۆمەڵێکی بەرفراوان لە بابەتەکانی تەندروستی و دادپەروەری کۆمەڵایەتییان لەخۆدەگرت، لەوانە تەندروستی و مافەکانی سێکسی و زاوزێ (SRHR)، توندوتیژی لەسەر بنەمای ڕەگەز (GBV)، یەکسانی ڕەگەزی، و پرسە گرنگەکانی تر کە کاریگەرییان لەسەر تەندروستی و خۆشگوزەرانی کۆمەڵگاکان هەیە.

    لە نوجین، باوەڕمان وایە کە بەهێزکردنی گەنجان — بەتایبەتی پیشەگەرانی داهاتووی تەندروستی — بنەڕەتییە بۆ بونیاتنانی سیستەمێکی تەندروستی ئاگادارتر، گشتگیرتر، و دادپەروەرتر. شانازی دەکەین کە لە پاڵ خوێندکارە گەنجەکانی پزیشکیدا دەوەستین و پشتگیری ئەو بۆشاییانە دەکەین کە تیایدا دەتوانن فێر ببن، پرسیار بکەن، داکۆکی بکەن، و ڕابەرایەتی بکەن.
