title: Awareness Sessions for Adolescent Girls in Mosul
titleAr: جلسات توعية للمراهقات الإناث حول الصحة الإنجابية — الموصل
titleKu: دانیشتنی ئاگادارکردنەوە بۆ کچە گەنجەکان دەربارەی SRHR — موسڵ
summary:
  en: Nujeen for Family Democratizing Organization held awareness sessions for adolescent female aged between (11-18) years old, on age appropriate SRHR topics in Mosul and surrounding areas.
  ar: عقدت نوجين جلسات توعية للمراهقات اللواتي تتراوح أعمارهن بين 11 و18 عامًا حول مواضيع الصحة والحقوق الجنسية والإنجابية المناسبة لأعمارهن، في الموصل والمناطق المحيطة بها.
  ku: نوجین دانیشتنی ئاگادارکردنەوەی بۆ کچە گەنجەکانی تەمەن 11 تا 18 ساڵ دەربارەی بابەتی SRHR ی گونجاو لەگەڵ تەمەنیان، لە موسڵ و ناوچەکانی دەوروبەری بەڕێوەبرد.
body:
  en: |
    Nujeen for Family Democratizing Organization held awareness sessions for adolescent female aged between (11-18) years old, on age appropriate SRHR topics in Mosul and surrounding areas.
  ar: |
    عقدت منظمة نوجين لدمقرطة الأسرة جلسات توعية للمراهقات اللواتي تتراوح أعمارهن بين 11 و18 عامًا، حول مواضيع الصحة والحقوق الجنسية والإنجابية المناسبة لأعمارهن، في الموصل والمناطق المحيطة بها.
  ku: |
    ڕێکخراوی نوجین بۆ دیموکراتیزەکردنی خێزان دانیشتنی ئاگادارکردنەوەی بۆ کچە گەنجەکانی تەمەن 11 تا 18 ساڵ بەڕێوەبرد، دەربارەی بابەتی SRHR ی گونجاو لەگەڵ تەمەنیان، لە موسڵ و ناوچەکانی دەوروبەری.
