title: Student Health Festival with IFMSA Kurdistan
titleAr: مهرجان صحة الطلاب مع IFMSA كردستان
titleKu: فیستیڤاڵی تەندروستی خوێندکاران لەگەڵ IFMSA کوردستان
summary:
  en: A regional festival breaking social stigma around reproductive health among students.
  ar: مهرجان إقليمي يكسر الوصمة الاجتماعية المرتبطة بالصحة الإنجابية بين الطلاب.
  ku: فیستیڤاڵێکی هەرێمی کە شەرمەزاری کۆمەڵایەتی دەربارەی تەندروستی زاوزێ لەنێو خوێندکاراندا دەشکێنێت.
body:
  en: |
    In partnership with IFMSA Kurdistan, Nujeen took part in a regional student health festival aimed at breaking the social stigma around reproductive health and opening honest conversation among young people.
