title: >-
  Providing SRHR Consultations and Family Planning Services at Domiz-2 Refugee
  Camp
titleAr: >-
  تقديم استشارات وخدمات الصحة والجنسية والإنجابية والتخطيط العائلي في مخيم دوميز
  2
titleKu: >-
  پێشکەشکردنی ڕاوێژکاری و خزمەتگوزارییەکانی تەندروستی سێکسی و زاوزێ لەگەڵ
  ڕێگاکانی ڕێکخستنی خێزان لە کامپی دومیز ٢
summary:
  en: >-
    Nujeen Organization for Family Democratizing continues providing Sexual and
    Reproductive Health and Rights (SRHR) consultations and family planning
    services through its clinic in Domiz-2 refugee camp as part of its ongoing
    project with SAAF.
  ar: >-
    تواصل منظمة نوجين لديمقراطية الأسرة تقديم استشارات وخدمات الصحة والجنسية
    والإنجابية والتربية الجنسية (SRHR)، بما في ذلك وسائل التخطيط العائلي، من
    خلال عيادتها في مخيم دوميز 2 للاجئين ضمن أنشطة مشروعها مع SAAF.
  ku: >-
    ڕێکخراوا نوجین بۆ دیموکراتیکرنا خێزانێ بەردەوامە ل سەر پێشکێشکرنا شاوێرمەندی
    و خزمەتگوزاریێن تەندرۆستیا سێکسی و زاوزێ (SRHR) و ڕێکێن ڕێکخستنا خێزانێ ب
    ڕێیا کلینیکا خۆ ل کامپا دومیز ٢ یا پەنابەران، وەک بەشەک ژ چالاکیێن پرۆژەیێ
    مە لگەڵ SAAF.
body:
  en: >-
    Nujeen Organization for Family Democratizing is continuing its commitment to
    supporting healthcare access for refugees. As part of our project
    implemented in partnership with the Safe Abortion Action Fund (SAAF) running
    from July 1, 2026, to July 1, 2028, we offer comprehensive SRHR services.


    **Key Services Offered:**

    * Sexual and Reproductive Health and Rights (SRHR) consultations

    * Family planning methods and counseling

    * Healthcare support delivered directly through our dedicated clinic in
    Domiz-2 refugee camp


    Our mission remains focused on protecting health rights and enhancing
    community well-being in camp settings.
  ar: >-
    تواصل منظمة نوجين لديمقراطية الأسرة التزامها بدعم الوصول إلى الرعاية الصحية
    للاجئين. كجزء من مشروعنا المنفذ بالشراكة مع صندوق العمل من أجل الإجهاض الآمن
    (SAAF) والممتد من 1 تموز/يوليو 2026 حتى 1 تموز/يوليو 2028، نقدم خدمات شاملة
    في مجال الصحة والجنسية والإنجابية.


    **الخدمات الرئيسية المقدمة:**

    * استشارات الصحة والجنسية والإنجابية (SRHR)

    * وسائل وتوعية التخطيط العائلي

    * تقديم الدعم الطبي والرعاية الصحية المباشرة من خلال عيادتنا في مخيم دوميز 2
    للاجئين


    تظل مهمتنا تركز على حماية الحقوق الصحية وتعزيز رفاهية المجتمع داخل المخيمات.
  ku: >-
    ڕێکخراوا نوجین بۆ دیموکراتیکرنا خێزانێ بەردەوامە ل سەر پێگۆهۆڕیا خۆ بۆ
    پشتەڤانیکرنا گەهشتنا ڕاژێن تەندرۆستی بۆ پەنابەران. وەک بەشەک ژ پرۆژەیێ مە یێ
    هەڤبەش لگەڵ SAAF کو ژ ڕێکەفتی ١/٧/٢٠٢٦ هەتا ١/٧/٢٠٢٨ یا بەردەوامە، ئاشۆپێن
    خزمەتگوزاریێن گشتگیر یێن تەندرۆستیا سێکسی و زاوزێ پێشکێش دکەین.


    **گرنگترین خزمەتگوزاریێن دهێنە پێشکێشکرن:**

    * شاوێرمەندیێن تەندرۆستیا سێکسی و زاوزێ (SRHR)

    * ڕێکێن ڕێکخستنا خێزانێ و هۆشیارکرن

    * دابینکرنا پشتەڤانیا تەندرۆستی ب شێوەیەکێ ڕاستەوخۆ ب ڕێیا کلینیکا مە ل
    کامپا دومیز ٢ یا پەنابەران


    ئارمانجا مە یا بەردەوام پاراستنا مافێن تەندرۆستی و بڵندکرنا ئاستێ لێهاتن و
    ساخلەمیا جڤاکی یە ل ناو کامپاندا.
