title: Focus Group Discussion on SRHR
titleAr: جلسة نقاش مجموعة مركزة حول الصحة والحقوق الجنسية والإنجابية
titleKu: گفتوگۆیا گروپێن تایبەت ل سەر SRHR
summary:
  en: Nujeen held Focus Group Discussions with community Leaders in different sectors including (Health, education, NGO and humanitarian fields) on SRHR and the how to improve access to it in the region.
  ar: عقدت نوجين جلسات نقاش مع قادة المجتمع من قطاعات الصحة والتعليم والعمل الإنساني لتحديد سبل تحسين الوصول إلى خدمات الصحة والحقوق الجنسية والإنجابية في المنطقة.
  ku: رێکخراوا نوژین گفتوگۆیێن گروپێن تایبەت دگەل رێبەرێن جڤاکی ژ بوارێن جۆراوجۆر (ساخلەمی، پەروەردە، رێکخراوێن ناحکومی و بوارێ مروڤاتی) ل سەر SRHR و چاوانیا باشترکرنا گەهشتنا وێ ل دەڤەرێ ئەنجامدان.
body:
  en: |
    Nujeen held Focus Group Discussions with community Leaders in different sectors including (Health, education, NGO and humanitarian fields) on SRHR and the how to improve access to it in the region.
  ar: |
    عقدت نوجين جلسات نقاش مجموعة مركزة مع قادة المجتمع في قطاعات مختلفة — بما في ذلك الصحة والتعليم والمنظمات غير الحكومية والمجال الإنساني — حول الصحة والحقوق الجنسية والإنجابية (SRHR) وكيفية تحسين الوصول إليها في المنطقة.
  ku: |
    رێکخراوا نوژین گفتوگۆیێن گروپێن تایبەت دگەل رێبەرێن جڤاکی ژ بوارێن جۆراوجۆر ئەنجامدان — ژ وان ژی ساخلەمی، پەروەردە، رێکخراوێن ناحکومی و بوارێ مروڤاتی — ل سەر ساخلەمی و مافێن سێکسی و زاوزێ (SRHR) و چاوانیا باشترکرنا گەهشتنا خەلکی بۆ ڤان خزمەتان ل دەڤەرێ.
