title: SRH Awareness Outreach at Ramadan Bazar
titleAr: التوعية بالصحة الجنسية والإنجابية في بازار رمضان
titleKu: ئاگادارکردنەوە لە تەندروستی سێکسی و زاوزێ لە بازاڕی ڕەمەزان
summary:
  en: Nujeen for Family Democratizing Organization sponsored and participated with SCORA-IFMSA Kurdistan in a community outreach activity raising awareness on various SRH topics, conducted by medical students of the University of Duhok at Ramadan Bazar, Duhok Mall. The activity included providing IEC materials as well as consultations from our professional staff.
  ar: رعت منظمة نوجين لدمقرطة الأسرة وشاركت مع SCORA-IFMSA كردستان في نشاط توعية مجتمعي حول مواضيع متنوعة في الصحة الجنسية والإنجابية، نفّذه طلاب كلية الطب في جامعة دهوك في بازار رمضان بدهوك مول. تضمّن النشاط تقديم مواد توعوية (IEC) إضافة إلى استشارات من طاقمنا المتخصص.
  ku: ڕێکخراوی نوجین بۆ دیموکراتیزەکردنی خێزان سپۆنسەری کرد و بەشداری کرد لەگەڵ SCORA-IFMSA کوردستان لە چالاکییەکی ئاگادارکردنەوەی کۆمەڵگا لەسەر بابەتە جۆراوجۆرەکانی تەندروستی سێکسی و زاوزێ، کە لەلایەن خوێندکارانی کۆلێژی پزیشکی زانکۆی دهۆکەوە لە بازاڕی ڕەمەزان لە دهۆک مۆڵ ئەنجامدرا. چالاکییەکە بریتی بوو لە دابینکردنی ماددەی ئاگادارکەرەوە (IEC) هەروەها ڕاوێژکاری لەلایەن ستافی پیشەیمان.
body:
  en: |
    Nujeen for Family Democratizing Organization sponsored and participated with SCORA-IFMSA Kurdistan in a community outreach activity raising awareness on various SRH topics, conducted by medical students of the University of Duhok at Ramadan Bazar, Duhok Mall. The activity included providing IEC materials as well as consultations from our professional staff.
