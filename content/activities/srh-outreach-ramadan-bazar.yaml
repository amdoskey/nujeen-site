  ku: |
    ڕێکخراوی نوجین بۆ دیموکراتیزەکردنی خێزان سپۆنسەری کرد و بەشداری کرد لەگەڵ SCORA-IFMSA کوردستان لە چالاکییەکی ئاگادارکردنەوەی کۆمەڵگا لەسەر بابەتە جۆراوجۆرەکانی تەندروستی سێکسی و زاوزێ، کە لەلایەن خوێندکارانی کۆلێژی پزیشکی زانکۆی دهۆکەوە لە بازاڕی ڕەمەزان لە دهۆک مۆڵ ئەنجامدرا. چالاکییەکە بریتی بوو لە دابینکردنی ماددەی ئاگادارکەرەوە (IEC) هەروەها ڕاوێژکاری لەلایەن ستافی پیشەیمان.
