title: Family Planning Training for Health Workers
titleAr: تدريب تنظيم الأسرة للعاملين الصحيين
titleKu: ڕاهێنانی خێزان‌دانان بۆ کارمەندانی تەندروستی
summary:
  en: Two one-day workshops with the Directorate of Preventive Health Affairs for 50 staff.
  ar: ورشتا عمل ليوم واحد بالتعاون مع مديرية الشؤون الصحية الوقائية لـ 50 موظفًا.
  ku: دوو ڕاهێنانی یەک ڕۆژە لەگەڵ بەڕێوەبەرایەتی کاروباری تەندروستی پێشگیرکەرەوە بۆ 50 کارمەند.
body:
  en: |
    Nujeen delivered two one-day training workshops in partnership with the Directorate of Preventive Health Affairs, reaching 50 health workers across Duhok.

    The sessions focused on practical family planning counselling skills so that participating staff can better support patients across the region's clinics and health centres.
