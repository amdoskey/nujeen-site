body:
  en: |
    Nujeen for Family Democratizing Organization held awareness sessions for adolescent male aged between (12-18) years old, on age appropriate SRHR topics in Mosul and surrounding areas.
  ar: |
    عقدت منظمة نوجين لدمقرطة الأسرة جلسات توعية للمراهقين الذكور الذين تتراوح أعمارهم بين 12 و18 عامًا، حول مواضيع الصحة والحقوق الجنسية والإنجابية المناسبة لأعمارهم، في الموصل والمناطق المحيطة بها.
  ku: |
    رێکخراوا نوژین ژبو دیموکراسیکرنا خێزانێ دانیشتنێن هۆشیارکرنێ بۆ کوڕێن هەرزەکار یێن تەمەنێ وان د ناڤبەرا 12 بۆ 18 سالان دا ئەنجامدان، ل سەر بابەتێن ساخلەمی و مافێن سێکسی و زاوزێ (SRHR) یێن گونجای دگەل تەمەنێ وان، ل مووسل و دەڤەرێن دەوروبەر.
