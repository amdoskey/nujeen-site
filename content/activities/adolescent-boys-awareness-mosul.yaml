title: Awareness Sessions for Adolescent Boys in Mosul
titleAr: جلسات توعية للمراهقين الذكور حول الصحة الإنجابية — الموصل
titleKu: دانیشتنی ئاگادارکردنەوە بۆ کوڕە گەنجەکان دەربارەی SRHR — موسڵ
summary:
  en: Nujeen for Family Democratizing Organization held awareness sessions for adolescent male aged between (12-18) years old, on age appropriate SRHR topics in Mosul and surrounding areas.
  ar: عقدت نوجين جلسات توعية للمراهقين الذكور الذين تتراوح أعمارهم بين 12 و18 عامًا حول مواضيع الصحة والحقوق الجنسية والإنجابية المناسبة لأعمارهم، في الموصل والمناطق المحيطة بها.
  ku: نوجین دانیشتنی ئاگادارکردنەوەی بۆ کوڕە گەنجەکانی تەمەن 12 تا 18 ساڵ دەربارەی بابەتی SRHR ی گونجاو لەگەڵ تەمەنیان، لە موسڵ و ناوچەکانی دەوروبەری بەڕێوەبرد.
body:
  en: |
    Nujeen for Family Democratizing Organization held awareness sessions for adolescent male aged between (12-18) years old, on age appropriate SRHR topics in Mosul and surrounding areas.
  ar: |
    عقدت منظمة نوجين لدمقرطة الأسرة جلسات توعية للمراهقين الذكور الذين تتراوح أعمارهم بين 12 و18 عامًا، حول مواضيع الصحة والحقوق الجنسية والإنجابية المناسبة لأعمارهم، في الموصل والمناطق المحيطة بها.
  ku: |
    ڕێکخراوی نوجین بۆ دیموکراتیزەکردنی خێزان دانیشتنی ئاگادارکردنەوەی بۆ کوڕە گەنجەکانی تەمەن 12 تا 18 ساڵ بەڕێوەبرد، دەربارەی بابەتی SRHR ی گونجاو لەگەڵ تەمەنیان، لە موسڵ و ناوچەکانی دەوروبەری.
