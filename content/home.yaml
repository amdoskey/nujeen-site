focusEyebrow:
  en: What we do
  ar: ماذا نفعل
  ku: چیمان دەکەین
focusHeading:
  en: Our work spans peace-building, development, and human rights.
  ar: ""
  ku: ""
focusIntro:
  en: It takes many forms across the communities we serve — from child protection and women's empowerment to reproductive health, support for displaced families, youth leadership, and the inclusion of people with disabilities and minorities. Nujeen works wherever families and individuals need support to live with dignity and equal rights.
  ar: ""
  ku: ""
recentEyebrow:
  en: From the field
  ar: من الميدان
  ku: لە مەیدانەوە
recentHeading:
  en: Recent activities
  ar: أحدث الأنشطة
  ku: چالاکییە نوێیەکان
quoteBand:
  en: We don't just deliver sessions. We build the *understanding* that lets a community care for its own.
  ar: نحن لا نكتفي بتقديم الجلسات. نحن نبني *الفهم* الذي يمكّن المجتمع من رعاية أفراده.
  ku: ئێمە تەنها دانیشتن پێشکەش ناکەین. ئێمە *تێگەیشتن* بنیات دەنێین کە ڕێگا بە کۆمەڵگا دەدات خۆی چاودێری بکات.
quoteBandSource:
  en: Nujeen for Family Democratizing Organization
  ar: منظمة نوجين لدمقرطة الأسرة
  ku: ڕێکخراوی نوجین بۆ دیموکراتیزەکردنی خێزان
