quoteBand:
  en: We don't just deliver sessions. We build the *understanding* that lets a community care for its own.
  ar: نحن لا نكتفي بتقديم الجلسات. نحن نبني *الفهم* الذي يمكّن المجتمع من رعاية أفراده.
  ku: ئێمە تەنها دانیشتن پێشکەش ناکەین. ئێمە *تێگەیشتن* بنیات دەنێین کە ڕێگا بە کۆمەڵگا دەدات خۆی چاودێری بکات.
quoteBandSource:
  en: Nujeen for Family Democratizing Organization
  ar: منظمة نوجين لدمقرطة الأسرة
  ku: ڕێکخراوی نوجین بۆ دیموکراتیزەکردنی خێزان
