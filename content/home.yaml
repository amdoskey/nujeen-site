eyebrow:
  en: Family health · Women's rights · Community
  ar: الصحة الأسرية · حقوق المرأة · المجتمع
  ku: تەندروستی خێزان · مافی ژنان · کۆمەڵگا
headlinePlain:
  en: "Standing with women and families,"
  ar: "الوقوف إلى جانب النساء والأسر،"
  ku: "لەگەڵ ژنان و خێزانەکاندا ڕاوەستاون،"
headlineEmphasis:
  en: where it matters most.
  ar: حيث تشتد الحاجة.
  ku: لەوێ کە زۆرترین پێویستیشیانە.
dek:
  en: From the neighborhoods of Duhok to the displacement camps, Nujeen advances reproductive health, family planning, and the dignity of every woman and girl.
  ar: من أحياء دهوك إلى مخيمات النزوح، تعمل نوجين على النهوض بالصحة الإنجابية وتنظيم الأسرة وكرامة كل امرأة وفتاة.
  ku: لە گەڕەکەکانی دهۆک بۆ کەمپەکانی ئاوارەیی، نوجین کار لەسەر باشترکردنی تەندروستی زاوزێ، خێزان‌دانان و ڕێزی هەموو ژن و کچێک دەکات.
heroImage: /uploads/home/hero.jpeg
heroQuote:
  en: When a woman understands her own health, a whole family grows stronger.
  ar: عندما تفهم المرأة صحتها، تكبر الأسرة بأكملها قوةً.
  ku: کاتێک ژنێک لە تەندروستی خۆی تێبگات، هەموو خێزانەکە بەهێزتر دەبێت.
heroQuoteAttribution:
  en: Nujeen field team, Duhok
  ar: فريق نوجين الميداني، دهوك
  ku: تیمی مەیدانی نوجین، دهۆک
