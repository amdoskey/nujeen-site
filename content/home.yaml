ctaHeading:
  en: Partner with us, or lend your support.
  ar: كن شريكًا معنا، أو قدّم دعمك.
  ku: بەشداریمان بکە، یان پشتگیری پێشکەش بکە.
ctaText:
  en: Health directorates, academic faculties, international partners, and individuals — there's a place for you in this work.
  ar: مديريات الصحة، الكليات الأكاديمية، الشركاء الدوليون، والأفراد — هناك مكان لكم في هذا العمل.
  ku: بەڕێوەبەرایەتی تەندروستی، کۆلێژی ئەکادیمی، هاوبەشی نێودەوڵەتی، و تاکەکان — لەم کارەدا شوێنێک بۆ ئێوە هەیە.
