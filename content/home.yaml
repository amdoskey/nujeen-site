  - number: "2016"
    label:
      en: Serving the region since
      ar: تخدم المنطقة منذ
      ku: خزمەتکردنی ناوچەکە لە ساڵی
  - number: "11–49"
    label:
      en: Ages of women & girls reached
      ar: أعمار النساء والفتيات المستفيدات
      ku: تەمەنی ژنان و کچانی بەرەوپێش
  - number: "Domiz 2"
    label:
      en: Ongoing work inside refugee camps
      ar: عمل مستمر داخل مخيمات اللاجئين
      ku: کارکردنی بەردەوام لەناو کەمپی پەنابەران
focusEyebrow:
  en: What we do
  ar: ماذا نفعل
  ku: چیمان دەکەین
focusHeading:
  en: Five fields, one commitment to family wellbeing.
  ar: خمسة مجالات، التزام واحد برفاهية الأسرة.
  ku: پێنج بواری کار، یەک ئەرکی بەرزکردنەوەی خۆشگوزەرانی خێزان.
focusIntro:
  en: Each strand of our work reinforces the others — education leads to access, access builds trust, and trust opens the door to lasting change.
  ar: يعزز كل جانب من عملنا الجوانب الأخرى — التعليم يقود إلى الوصول، والوصول يبني الثقة، والثقة تفتح الباب أمام تغيير دائم.
  ku: هەر بەشێک لە کارەکەمان بەشەکانی تر بەهێز دەکات — پەروەردە ڕێگا بۆ دەستگەیشتن دەکاتەوە، دەستگەیشتن متمانە دروست دەکات، و متمانە دەرگا بۆ گۆڕانێکی بەردەوام دەکاتەوە.
focusAreas:
  - title:
      en: Reproductive Health Education
      ar: التثقيف الصحي الإنجابي
      ku: پەروەردەی تەندروستی زاوزێ
    description:
      en: Community outreach and awareness series on sexual and reproductive health and rights, delivered in plain language and safe spaces.
      ar: سلسلة توعية وتواصل مجتمعي حول الصحة والحقوق الجنسية والإنجابية، تُقدَّم بلغة بسيطة وفي أماكن آمنة.
      ku: کۆمەڵگای دەرەکی و زنجیرەی ئاگادارکردنەوە دەربارەی تەندروستی و مافی سێکسی و زاوزێ، بە زمانێکی سادە و لە شوێنی سەلامەت.
  - title:
      en: Family Planning
      ar: تنظيم الأسرة
      ku: خێزان‌دانان
    description:
      en: Targeted sessions for women and youth, focused on girls and women aged 11 to 49, grounded in informed choice.
      ar: جلسات موجهة للنساء والشباب، تركز على الفتيات والنساء من سن 11 إلى 49 عامًا، وترتكز على الاختيار المستنير.
      ku: دانیشتنی ئامانجدارکراو بۆ ژنان و گەنجان، تیشک دەخاتە سەر کچان و ژنانی تەمەن 11 تا 49 ساڵ، پشت بە هەڵبژاردنی ئاگادارانە دەبەستێت.
  - title:
      en: Refugee & IDP Support
      ar: دعم اللاجئين والنازحين
      ku: پشتگیری پەنابەران و ئاوارەکان
    description:
      en: Direct operations and education inside displacement venues, including a continuous presence at the Domiz 2 camp.
      ar: عمليات وتثقيف مباشر داخل مواقع النزوح، بما في ذلك حضور مستمر في مخيم دوميز 2.
      ku: کاری ڕاستەوخۆ و پەروەردە لەناو شوێنی ئاوارەیی، لەوانە بوونی بەردەوام لە کەمپی دۆمیز 2.
  - title:
      en: Legal & Policy Advocacy
      ar: المناصرة القانونية والسياساتية
      ku: پاراستنی یاسایی و سیاسەت
    description:
      en: Working alongside academic institutions and public health bodies to shape healthcare and legal reform.
      ar: العمل جنبًا إلى جنب مع المؤسسات الأكاديمية وهيئات الصحة العامة لتشكيل الإصلاح الصحي والقانوني.
      ku: کارکردن لەگەڵ دامەزراوە ئەکادیمی و دامودەزگای تەندروستی گشتی بۆ شێوەدانی چاکسازی تەندروستی و یاسایی.
  - title:
      en: Youth Empowerment
      ar: تمكين الشباب
      ku: بەهێزکردنی گەنجان
    description:
      en: Partnering with IFMSA Kurdistan on student health festivals that break stigma and open honest conversation.
      ar: الشراكة مع IFMSA كردستان في مهرجانات صحية طلابية تكسر الوصمة وتفتح حوارًا صادقًا.
      ku: هاوبەشی لەگەڵ IFMSA کوردستان لە فیستیڤاڵی تەندروستی خوێندکاران کە شەرمەزاری کۆمەڵایەتی دەشکێنێت و گفتوگۆیەکی ڕاستگۆیانە دەکاتەوە.
